[project]
name = "retail-etl"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0.0",
  "SQLAlchemy>=2.0.0",
  "PyMySQL>=1.1.0",
  "pymongo>=4.6.0",
  "python-dotenv>=1.0.0",
  "cryptography>=41.0"
]

[project.scripts]
retail-etl = "retail_etl.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]